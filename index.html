<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Samate — Costeo &amp; Precios</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ======================================================================
   PASO OBLIGATORIO: pega aquí la configuración de TU proyecto de Firebase.
   La sacas de: Firebase Console > Configuración del proyecto > Tus apps > (icono web) > Config.
   Este objeto es público por diseño (Firebase lo protege con las Reglas de
   seguridad de Firestore, no ocultándolo) así que no pasa nada por dejarlo
   visible en el HTML.
   ====================================================================== */
const firebaseConfig = {
  apiKey: "PEGA_AQUI_TU_API_KEY",
  authDomain: "PEGA_AQUI_TU_PROYECTO.firebaseapp.com",
  projectId: "PEGA_AQUI_TU_PROYECTO",
  storageBucket: "PEGA_AQUI_TU_PROYECTO.appspot.com",
  messagingSenderId: "PEGA_AQUI_TU_SENDER_ID",
  appId: "PEGA_AQUI_TU_APP_ID",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const MIN_WAGE_HOUR = 39.38;
const STORAGE_KEY = "recetas";

const storage = {
  get: async (uid) => {
    const snap = await db.collection("usuarios").doc(uid).get();
    if (!snap.exists) return null;
    const data = snap.data();
    return data && data[STORAGE_KEY] ? { value: data[STORAGE_KEY] } : null;
  },
  set: async (uid, value) => {
    await db.collection("usuarios").doc(uid).set({ [STORAGE_KEY]: value }, { merge: true });
    return { value };
  },
};

const uid_ = () => Math.random().toString(36).slice(2, 10);

const emptyIngredient = () => ({
  id: uid_(),
  name: "",
  qtyUsed: "",
  packageQty: "",
  packageCost: "",
  unit: "g",
});

const emptyRecipe = (n = 1) => ({
  id: uid_(),
  name: `Receta ${n}`,
  servings: 12,
  packagingCostPerUnit: 3,
  laborMinutes: 60,
  laborRate: MIN_WAGE_HOUR,
  indirectPct: 10,
  marginPct: 40,
  commissionPropio: 20.9,
  commissionApp: 34.8,
  ingredients: [emptyIngredient()],
});

const num = (v) => {
  const n = parseFloat(v);
  return Number.isFinite(n) ? n : 0;
};

const money = (n) =>
  `$${n.toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

const UNITS = ["g", "kg", "ml", "l", "pieza"];

function App() {
  const [user, setUser] = useState(undefined);
  const [authError, setAuthError] = useState("");

  useEffect(() => {
    return auth.onAuthStateChanged(setUser);
  }, []);

  const signIn = () => {
    setAuthError("");
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch((err) => setAuthError(err.message));
  };

  if (user === undefined) {
    return (
      <div className="min-h-[300px] flex items-center justify-center bg-stone-50 text-stone-500 font-sans">
        Cargando…
      </div>
    );
  }

  if (!user) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-stone-50 font-sans px-6">
        <div className="max-w-sm w-full text-center space-y-4">
          <h1 className="font-serif text-3xl text-amber-950">Samate</h1>
          <p className="text-stone-500 text-sm">
            Inicia sesión con tu cuenta de Google para guardar tus recetas en la nube y verlas
            desde cualquier dispositivo.
          </p>
          <button
            onClick={signIn}
            className="px-5 py-2.5 rounded-lg bg-amber-950 text-amber-50 text-sm font-medium hover:bg-amber-900 transition-colors"
          >
            Iniciar sesión con Google
          </button>
          {authError && <p className="text-rose-600 text-xs">{authError}</p>}
        </div>
      </div>
    );
  }

  return <CosteoPostres uid={user.uid} email={user.email} onSignOut={() => auth.signOut()} />;
}

function CosteoPostres({ uid, email, onSignOut }) {
  const [recipes, setRecipes] = useState([emptyRecipe(1)]);
  const [activeId, setActiveId] = useState(null);
  const [status, setStatus] = useState("loading");
  const [saveTick, setSaveTick] = useState(null);
  const firstLoad = useRef(true);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get(uid);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          if (Array.isArray(parsed) && parsed.length > 0) {
            setRecipes(parsed);
            setActiveId(parsed[0].id);
            setStatus("ready");
            return;
          }
        }
      } catch (e) {}
      setActiveId(recipes[0].id);
      setStatus("ready");
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  useEffect(() => {
    if (status !== "ready") return;
    if (firstLoad.current) {
      firstLoad.current = false;
      return;
    }
    setSaveTick("saving");
    const t = setTimeout(async () => {
      try {
        await storage.set(uid, JSON.stringify(recipes));
        setSaveTick("saved");
        setTimeout(() => setSaveTick(null), 1400);
      } catch (e) {
        setSaveTick("error");
      }
    }, 500);
    return () => clearTimeout(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [recipes, status]);

  const active = recipes.find((r) => r.id === activeId) || recipes[0];

  const patchActive = (patch) =>
    setRecipes((rs) => rs.map((r) => (r.id === active.id ? { ...r, ...patch } : r)));

  const patchIngredient = (id, patch) =>
    patchActive({
      ingredients: active.ingredients.map((i) => (i.id === id ? { ...i, ...patch } : i)),
    });

  const addIngredient = () =>
    patchActive({ ingredients: [...active.ingredients, emptyIngredient()] });

  const removeIngredient = (id) => {
    if (active.ingredients.length === 1) return;
    patchActive({ ingredients: active.ingredients.filter((i) => i.id !== id) });
  };

  const addRecipe = () => {
    const r = emptyRecipe(recipes.length + 1);
    setRecipes((rs) => [...rs, r]);
    setActiveId(r.id);
  };

  const removeRecipe = (id) => {
    if (recipes.length === 1) return;
    const rest = recipes.filter((r) => r.id !== id);
    setRecipes(rest);
    if (activeId === id) setActiveId(rest[0].id);
  };

  if (status === "loading" || !active) {
    return (
      <div className="min-h-[300px] flex items-center justify-center bg-stone-50 text-stone-500 font-sans">
        Cargando tus recetas…
      </div>
    );
  }

  const ingredientCostTotal = active.ingredients.reduce((sum, ing) => {
    const qty = num(ing.qtyUsed);
    const pkgQty = num(ing.packageQty);
    const pkgCost = num(ing.packageCost);
    if (pkgQty <= 0) return sum;
    return sum + (qty / pkgQty) * pkgCost;
  }, 0);

  const servings = Math.max(1, num(active.servings));
  const ingredientCostPerUnit = ingredientCostTotal / servings;
  const packagingCostPerUnit = num(active.packagingCostPerUnit);
  const directCostPerUnit = ingredientCostPerUnit + packagingCostPerUnit;
  const indirectCostPerUnit = directCostPerUnit * (num(active.indirectPct) / 100);
  const laborCostTotal = (num(active.laborMinutes) / 60) * num(active.laborRate);
  const laborCostPerUnit = laborCostTotal / servings;
  const totalCostPerUnit = directCostPerUnit + indirectCostPerUnit + laborCostPerUnit;
  const marginAmount = totalCostPerUnit * (num(active.marginPct) / 100);
  const directPrice = totalCostPerUnit + marginAmount;

  const propioComm = Math.min(0.95, num(active.commissionPropio) / 100);
  const appComm = Math.min(0.95, num(active.commissionApp) / 100);
  const pricePropio = directPrice / (1 - propioComm);
  const priceApps = directPrice / (1 - appComm);

  const ingredientPct = directPrice > 0 ? (ingredientCostPerUnit / directPrice) * 100 : 0;
  const inHealthyRange = ingredientPct >= 22 && ingredientPct <= 38;

  return (
    <div className="min-h-screen bg-stone-50 font-sans text-stone-800">
      <div className="bg-amber-950 text-amber-50 px-5 py-6 sm:px-8">
        <div className="max-w-5xl mx-auto flex items-center justify-between gap-4">
          <div>
            <h1 className="font-serif text-2xl sm:text-3xl tracking-tight">Samate — Costeo &amp; precios</h1>
            <p className="text-amber-200/80 text-sm mt-1">Anota tu receta real. El precio sale solo.</p>
          </div>
          <div className="text-right shrink-0">
            <p className="text-amber-200/70 text-xs">{email}</p>
            <button onClick={onSignOut} className="text-amber-200/70 text-xs underline hover:text-amber-50">
              Cerrar sesión
            </button>
          </div>
        </div>
      </div>

      <div className="max-w-5xl mx-auto px-5 sm:px-8 py-6 grid grid-cols-1 lg:grid-cols-[220px_1fr] gap-6">
        <div className="space-y-2">
          <div className="text-xs font-semibold uppercase tracking-wide text-stone-400 px-1 mb-1">Tus recetas</div>
          {recipes.map((r) => (
            <button
              key={r.id}
              onClick={() => setActiveId(r.id)}
              className={`w-full text-left px-3 py-2 rounded-lg border text-sm transition-colors ${
                r.id === active.id
                  ? "bg-amber-100 border-amber-300 text-amber-900 font-medium"
                  : "bg-white border-stone-200 text-stone-600 hover:border-amber-200"
              }`}
            >
              {r.name || "Sin nombre"}
            </button>
          ))}
          <button
            onClick={addRecipe}
            className="w-full flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg border border-dashed border-stone-300 text-stone-500 text-sm hover:border-amber-400 hover:text-amber-700 transition-colors"
          >
            + Nueva receta
          </button>
          <div className="h-6 flex items-center px-1 text-xs text-stone-400">
            {saveTick === "saving" && "Guardando en la nube…"}
            {saveTick === "saved" && <span className="text-emerald-600">✓ Guardado</span>}
            {saveTick === "error" && <span className="text-rose-600">No se pudo guardar</span>}
          </div>
        </div>

        <div className="space-y-5">
          <div className="bg-white border border-stone-200 rounded-xl p-4 sm:p-5">
            <div className="flex flex-col sm:flex-row gap-3 sm:items-end">
              <div className="flex-1">
                <label className="text-xs font-medium text-stone-500">Nombre de la receta</label>
                <input
                  value={active.name}
                  onChange={(e) => patchActive({ name: e.target.value })}
                  className="w-full mt-1 px-3 py-2 rounded-lg border border-stone-300 focus:outline-none focus:ring-2 focus:ring-amber-400 text-sm"
                  placeholder="ej. Brownie de sartén"
                />
              </div>
              <div className="w-full sm:w-40">
                <label className="text-xs font-medium text-stone-500">Piezas que rinde</label>
                <input
                  type="number"
                  min="1"
                  value={active.servings}
                  onChange={(e) => patchActive({ servings: e.target.value })}
                  className="w-full mt-1 px-3 py-2 rounded-lg border border-stone-300 focus:outline-none focus:ring-2 focus:ring-amber-400 text-sm font-mono"
                />
              </div>
              {recipes.length > 1 && (
                <button
                  onClick={() => removeRecipe(active.id)}
                  className="px-3 py-2 rounded-lg border border-stone-200 text-stone-400 hover:text-rose-600 hover:border-rose-200 transition-colors"
                  title="Eliminar esta receta"
                >
                  🗑
                </button>
              )}
            </div>
          </div>

          <div className="bg-white border border-stone-200 rounded-xl p-4 sm:p-5">
            <div className="flex items-center gap-2 mb-3">
              <span>📦</span>
              <h2 className="font-serif text-lg text-stone-900">Ingredientes</h2>
            </div>
            <div className="hidden sm:grid grid-cols-[1.4fr_0.7fr_0.9fr_0.9fr_0.7fr_auto] gap-2 px-1 text-xs font-medium text-stone-400 mb-1">
              <div>Ingrediente</div>
              <div>Usaste</div>
              <div>Paquete (cant.)</div>
              <div>Paquete (costo)</div>
              <div>Unidad</div>
              <div></div>
            </div>
            <div className="space-y-2">
              {active.ingredients.map((ing) => {
                const qty = num(ing.qtyUsed);
                const pkgQty = num(ing.packageQty);
                const pkgCost = num(ing.packageCost);
                const cost = pkgQty > 0 ? (qty / pkgQty) * pkgCost : 0;
                return (
                  <div
                    key={ing.id}
                    className="grid grid-cols-2 sm:grid-cols-[1.4fr_0.7fr_0.9fr_0.9fr_0.7fr_auto] gap-2 items-center bg-stone-50 sm:bg-transparent rounded-lg p-2 sm:p-0"
                  >
                    <input
                      value={ing.name}
                      onChange={(e) => patchIngredient(ing.id, { name: e.target.value })}
                      placeholder="ej. Avena"
                      className="col-span-2 sm:col-span-1 px-2.5 py-1.5 rounded-lg border border-stone-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400"
                    />
                    <input
                      type="number"
                      value={ing.qtyUsed}
                      onChange={(e) => patchIngredient(ing.id, { qtyUsed: e.target.value })}
                      placeholder="0"
                      className="px-2.5 py-1.5 rounded-lg border border-stone-300 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-amber-400"
                    />
                    <input
                      type="number"
                      value={ing.packageQty}
                      onChange={(e) => patchIngredient(ing.id, { packageQty: e.target.value })}
                      placeholder="0"
                      className="px-2.5 py-1.5 rounded-lg border border-stone-300 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-amber-400"
                    />
                    <input
                      type="number"
                      value={ing.packageCost}
                      onChange={(e) => patchIngredient(ing.id, { packageCost: e.target.value })}
                      placeholder="0"
                      className="px-2.5 py-1.5 rounded-lg border border-stone-300 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-amber-400"
                    />
                    <select
                      value={ing.unit}
                      onChange={(e) => patchIngredient(ing.id, { unit: e.target.value })}
                      className="px-2 py-1.5 rounded-lg border border-stone-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400"
                    >
                      {UNITS.map((u) => (
                        <option key={u} value={u}>{u}</option>
                      ))}
                    </select>
                    <div className="flex items-center justify-between sm:justify-end gap-2">
                      <span className="text-xs font-mono text-stone-400 sm:hidden">{money(cost)}</span>
                      <button
                        onClick={() => removeIngredient(ing.id)}
                        className="text-stone-300 hover:text-rose-600 transition-colors p-1"
                      >
                        🗑
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
            <button
              onClick={addIngredient}
              className="mt-3 flex items-center gap-1.5 text-sm text-amber-700 hover:text-amber-900 font-medium"
            >
              + Agregar ingrediente
            </button>
            <p className="mt-3 text-xs text-stone-400">
              ℹ️ Usa la misma unidad en "usaste" y en "paquete" (gramos con gramos, ml con ml). Para piezas sueltas (ej. huevo, plátano) usa unidad "pieza".
            </p>
          </div>

          <div className="bg-white border border-stone-200 rounded-xl p-4 sm:p-5">
            <div className="flex items-center gap-2 mb-3">
              <span>%</span>
              <h2 className="font-serif text-lg text-stone-900">Costos indirectos, tiempo y margen</h2>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div>
                <label className="text-xs font-medium text-stone-500">Empaque / pieza</label>
                <input type="number" value={active.packagingCostPerUnit} onChange={(e) => patchActive({ packagingCostPerUnit: e.target.value })} className="w-full mt-1 px-2.5 py-1.5 rounded-lg border border-stone-300 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-amber-400" />
              </div>
              <div>
                <label className="text-xs font-medium text-stone-500">⏱ Minutos totales</label>
                <input type="number" value={active.laborMinutes} onChange={(e) => patchActive({ laborMinutes: e.target.value })} className="w-full mt-1 px-2.5 py-1.5 rounded-lg border border-stone-300 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-amber-400" />
              </div>
              <div>
                <label className="text-xs font-medium text-stone-500">Tu hora vale</label>
                <input type="number" value={active.laborRate} onChange={(e) => patchActive({ laborRate: e.target.value })} className="w-full mt-1 px-2.5 py-1.5 rounded-lg border border-stone-300 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-amber-400" />
              </div>
              <div>
                <label className="text-xs font-medium text-stone-500">% indirectos</label>
                <input type="number" value={active.indirectPct} onChange={(e) => patchActive({ indirectPct: e.target.value })} className="w-full mt-1 px-2.5 py-1.5 rounded-lg border border-stone-300 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-amber-400" />
              </div>
            </div>
            <div className="mt-3 grid grid-cols-1 sm:grid-cols-[1fr_auto] gap-3 items-end">
              <div>
                <label className="text-xs font-medium text-stone-500">Margen de ganancia que quieres (%)</label>
                <input type="range" min="10" max="150" value={active.marginPct} onChange={(e) => patchActive({ marginPct: e.target.value })} className="w-full mt-2 accent-amber-700" />
              </div>
              <div className="font-mono text-amber-800 text-lg font-semibold text-right">{num(active.marginPct).toFixed(0)}%</div>
            </div>
            <p className="mt-2 text-xs text-stone-400">
              Gas, luz, agua y desgaste de equipo van en "% indirectos" (10% es un punto de partida común). Tu hora por defecto está puesta en el salario mínimo 2026 ($39.38/hora, zona general) — súbela si tu trabajo vale más que eso, que seguro sí.
            </p>
          </div>

          <div className="bg-white border border-stone-200 rounded-xl p-4 sm:p-5">
            <h2 className="font-serif text-lg text-stone-900 mb-3">Desglose por pieza</h2>
            <div className="text-sm font-mono divide-y divide-stone-100">
              <Row label="Ingredientes" value={ingredientCostPerUnit} />
              <Row label="Empaque" value={packagingCostPerUnit} />
              <Row label="Indirectos" value={indirectCostPerUnit} />
              <Row label="Tu mano de obra" value={laborCostPerUnit} />
              <Row label="Costo total" value={totalCostPerUnit} bold />
              <Row label={`Ganancia (${num(active.marginPct).toFixed(0)}%)`} value={marginAmount} />
              <Row label="Precio venta directa" value={directPrice} bold accent />
            </div>
            <div className={`mt-4 text-xs rounded-lg px-3 py-2 ${inHealthyRange ? "bg-emerald-50 text-emerald-800" : "bg-amber-50 text-amber-800"}`}>
              ℹ️ Tus ingredientes son {ingredientPct.toFixed(0)}% del precio directo — el rango sano en el sector es 25%-35%.{" "}
              {inHealthyRange ? "Vas bien." : ingredientPct > 38 ? "Está alto: sube el precio o revisa porciones/proveedor." : "Tienes margen para invertir en mejores ingredientes si quieres."}
            </div>
          </div>

          <div className="bg-white border border-stone-200 rounded-xl p-4 sm:p-5">
            <h2 className="font-serif text-lg text-stone-900 mb-1">Precio por canal de venta</h2>
            <p className="text-xs text-stone-400 mb-3">Misma ganancia real en los tres — el precio sube para compensar la comisión de cada plataforma (incluye el 16% de IVA sobre la comisión).</p>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <ChannelCard icon="🛵" label="Directo" sub="WhatsApp/redes + tú entregas o DiDi Entrega Light" price={directPrice} tone="emerald" />
              <ChannelCard
                icon="🚚"
                label="DiDi Food, reparto propio"
                sub={<>comisión <input type="number" step="0.1" value={active.commissionPropio} onChange={(e) => patchActive({ commissionPropio: e.target.value })} className="w-14 px-1 py-0.5 rounded border border-stone-300 text-xs font-mono" />%</>}
                price={pricePropio}
                tone="amber"
              />
              <ChannelCard
                icon="🏪"
                label="Uber Eats / Rappi / DiDi con reparto de la app"
                sub={<>comisión <input type="number" step="0.1" value={active.commissionApp} onChange={(e) => patchActive({ commissionApp: e.target.value })} className="w-14 px-1 py-0.5 rounded border border-stone-300 text-xs font-mono" />%</>}
                price={priceApps}
                tone="rose"
              />
            </div>
          </div>

          <p className="text-center text-xs text-stone-400 pb-4">
            Tus recetas se guardan en la nube en tu cuenta de Google — ábrelo desde cualquier dispositivo con la misma cuenta.
          </p>
        </div>
      </div>
    </div>
  );
}

function Row({ label, value, bold, accent }) {
  return (
    <div className="flex items-center justify-between py-1.5">
      <span className={`font-sans ${bold ? "text-stone-900 font-medium" : "text-stone-500"}`}>{label}</span>
      <span className={`${bold ? "font-semibold" : ""} ${accent ? "text-amber-800 text-base" : "text-stone-800"}`}>{money(value)}</span>
    </div>
  );
}

function ChannelCard({ icon, label, sub, price, tone }) {
  const tones = {
    emerald: "bg-emerald-50 border-emerald-200 text-emerald-900",
    amber: "bg-amber-50 border-amber-200 text-amber-900",
    rose: "bg-rose-50 border-rose-200 text-rose-900",
  };
  return (
    <div className={`rounded-xl border p-3.5 ${tones[tone]}`}>
      <div className="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wide opacity-80">
        <span>{icon}</span>{label}
      </div>
      <div className="mt-2 text-2xl font-mono font-semibold">{money(price)}</div>
      <div className="mt-1 text-xs opacity-70">{sub}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
